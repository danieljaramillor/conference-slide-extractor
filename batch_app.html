<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conference Slide Extractor</title>
  <style>__APP_STYLE__</style>
</head>
<body>
  <header class="site-bar shell">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Conference Slide Extractor</div>
    <span class="status-chip">Local processing</span>
  </header>
  <main class="dashboard-main shell">
    <section class="intake-panel glass" aria-labelledby="new-title">
      <div class="hero-copy">
        <h1 id="new-title">From captures<br>to <em>slides.</em></h1>
        <p>Turn a ZIP of conference screenshots into distinct slides with searchable text.</p>
      </div>
      <form id="submit" class="intake-form">
        <div id="drop-zone" class="drop-zone">
          <span class="upload-mark" aria-hidden="true">↑</span>
          <h2>Drop a screenshot ZIP</h2>
          <p id="file-name" class="file-name" aria-live="polite">Or choose a file from your device</p>
          <label class="file-button">Choose ZIP<input id="archive" type="file" accept=".zip,application/zip" required></label>
        </div>
        <button id="start" class="primary" type="submit" disabled>Extract slides</button>
        <progress id="transfer" max="100" hidden aria-label="ZIP transfer progress"></progress>
        <p id="status" class="notice" role="status" aria-live="polite" hidden></p>
      </form>
    </section>
    <section class="batch-section" aria-labelledby="batches-title">
      <div class="section-title"><h2 id="batches-title">Batches</h2><span id="batch-count" class="section-count"></span></div>
      <div id="jobs" class="jobs-list"><p class="empty-jobs">Loading batches…</p></div>
    </section>
  </main>
  <script>
    const token = '__UPLOAD_TOKEN__';
    const archive = document.getElementById('archive');
    const start = document.getElementById('start');
    const dropZone = document.getElementById('drop-zone');
    const fileName = document.getElementById('file-name');
    const status = document.getElementById('status');
    const transfer = document.getElementById('transfer');
    const jobs = document.getElementById('jobs');
    let busy = true;
    let uploading = false;
    let lastSnapshot;

    function message(text, isError = false) {
      status.hidden = !text;
      status.textContent = text;
      status.classList.toggle('error', isError);
    }

    function updateButton() {
      start.disabled = busy || uploading || !archive.files.length;
    }

    function updateSelection() {
      fileName.textContent = archive.files[0]?.name || 'Or choose a file from your device';
      updateButton();
    }

    function renderBatches(batches) {
      jobs.replaceChildren();
      document.getElementById('batch-count').textContent = batches.length || '';
      if (!batches.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-jobs';
        empty.textContent = 'Submitted batches will appear here.';
        jobs.append(empty);
        return;
      }
      for (const batch of batches) {
        const row = document.createElement('article');
        row.className = 'job-row';
        const icon = document.createElement('span');
        icon.className = 'job-icon';
        icon.textContent = '▤';
        icon.setAttribute('aria-hidden', 'true');
        row.append(icon);
        const info = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'job-name';
        name.textContent = batch.name;
        const details = document.createElement('div');
        details.className = 'job-details';
        if (batch.state === 'ready') {
          const stats = batch.stats;
          details.textContent = `${stats.processed}/${stats.input_images} captures processed · ${stats.selected} selected · ${stats.needs_review} to check`;
          if (batch.speaker_excluded) details.textContent += ` · ${batch.speaker_excluded} speaker-only excluded`;
          if (batch.transitions_excluded) details.textContent += ` · ${batch.transitions_excluded} blended transitions excluded`;
          if (batch.possible_blends) details.textContent += ` · ${batch.possible_blends} possible blend${batch.possible_blends === 1 ? '' : 's'} to check`;
          if (batch.speaker_check === 'partial' || batch.speaker_check === 'unavailable') {
            details.textContent += ' · Speaker check incomplete';
          }
          if (batch.ocr_errors) details.textContent += ` · ${batch.ocr_errors} OCR errors`;
          const link = document.createElement('a');
          link.className = 'action';
          link.href = `/batches/${batch.id}/`;
          link.textContent = 'Review slides';
          row.append(info, link);
        } else {
          const state = document.createElement('div');
          const failed = batch.state === 'failed';
          state.className = failed ? 'status-chip error' : 'status-chip';
          state.textContent = failed ? 'Failed' : 'In progress';
          details.textContent = batch.progress;
          row.append(info, state);
        }
        info.append(name, details);
        jobs.append(row);
      }
    }

    async function refresh() {
      try {
        const response = await fetch('/jobs');
        if (!response.ok) throw new Error('Could not read batch status.');
        const snapshot = await response.json();
        busy = snapshot.busy;
        const signature = JSON.stringify(snapshot);
        if (signature !== lastSnapshot) {
          renderBatches(snapshot.batches);
          lastSnapshot = signature;
        }
      } catch {
        busy = true;
        message('The application is unavailable. Check the window that started it.', true);
      }
      updateButton();
    }

    archive.addEventListener('change', updateSelection);
    dropZone.addEventListener('dragover', event => {
      if (!event.dataTransfer.types.includes('Files')) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = uploading ? 'none' : 'copy';
      dropZone.classList.toggle('is-dragging', !uploading);
    });
    dropZone.addEventListener('dragleave', event => {
      if (!dropZone.contains(event.relatedTarget)) dropZone.classList.remove('is-dragging');
    });
    dropZone.addEventListener('drop', event => {
      event.preventDefault();
      dropZone.classList.remove('is-dragging');
      if (uploading) return;
      const files = event.dataTransfer.files;
      if (files.length !== 1 || !/\.zip$/i.test(files[0].name)) {
        message('Drop one screenshot ZIP file.', true);
        return;
      }
      archive.files = files;
      message('');
      updateSelection();
    });
    document.getElementById('submit').addEventListener('submit', event => {
      event.preventDefault();
      const file = archive.files[0];
      if (!file || busy || uploading) return;
      uploading = true;
      updateButton();
      transfer.value = 0;
      transfer.hidden = false;
      message('Sending ZIP to the extraction machine…');
      const request = new XMLHttpRequest();
      request.open('POST', '/jobs');
      request.setRequestHeader('X-Batch-Token', token);
      request.setRequestHeader('X-Archive-Name', encodeURIComponent(file.name));
      request.upload.onprogress = event => {
        if (event.lengthComputable) transfer.value = 100 * event.loaded / event.total;
      };
      request.onload = () => {
        if (request.status === 202) {
          archive.value = '';
          updateSelection();
          message('ZIP received. Follow processing in Batches.');
        } else {
          let error = 'The ZIP could not be submitted.';
          try { error = JSON.parse(request.responseText).error || error; } catch {}
          message(error, true);
        }
      };
      request.onerror = () => message('Transfer failed. Select the ZIP to retry.', true);
      request.onloadend = () => {
        uploading = false;
        transfer.hidden = true;
        busy = true;
        refresh();
      };
      request.send(file);
    });
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
