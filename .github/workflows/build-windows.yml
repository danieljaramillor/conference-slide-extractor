name: Build Windows executable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - build-windows.ps1
      - desktop_app.py
      - desktop_window.py
      - server_workflow.py
      - assets/practice.zip
      - tests/windows_executable_check.py

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build requirements
        run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Install the headless test browser
        run: python -m playwright install chromium --only-shell
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Bundle application
        run: .\build-windows.ps1 -Python python
      - name: Test bundled OCR and the browser export
        run: python tests/windows_executable_check.py dist/ConferenceSlideExtractor-Windows-x64.exe --browser
      - uses: actions/upload-artifact@v4
        with:
          name: ConferenceSlideExtractor-Windows-x64
          path: |
            dist/ConferenceSlideExtractor-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
